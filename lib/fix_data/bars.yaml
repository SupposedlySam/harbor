# `dart fix` transforms for `bars:`, which replaced `clear:` and the HarborClear enum in 0.8.0 (#120,
# Q1). Checked by test_fixes/bars.dart.
#
# The rewrite depends on the value, so only the two literal spellings are fixed:
# `clear: HarborClear.coast` becomes `bars: false`, and `clear: HarborClear.everything`, the
# default, is removed. A `clear:` given anything else (a variable, a conditional) is left for you.
#
# 0.9.0 removed the enum and `clear:`, so the name HarborClear could go to the widget HarborMoored
# was. A call still on `clear:` no longer compiles, and these transforms still rewrite it, keyed on
# the classes the old names now resolve to. They read the argument as text, so `HarborClear.coast`
# matches though it names nothing now. HarborFairway is a deprecated subclass of HarborScrollView, so
# its calls are keyed on it as well.
version: 1
transforms:
  # HarborMoored(clear:), now HarborClear(clear:)
  - title: "Migrate to 'bars'"
    date: 2026-10-14
    element:
      uris: [ 'harbor.dart' ]
      constructor: ''
      inClass: 'HarborClear'
    oneOf:
      - if: "clear == 'HarborClear.coast'"
        changes:
          - kind: 'addParameter'
            index: 2
            name: 'bars'
            style: optional_named
            argumentValue:
              expression: 'false'
              requiredIf: "clear == 'HarborClear.coast'"
          - kind: 'removeParameter'
            name: 'clear'
      - if: "clear == 'HarborClear.everything'"
        changes:
          - kind: 'removeParameter'
            name: 'clear'
    variables:
      clear:
        kind: 'fragment'
        value: 'arguments[clear]'

  # HarborMoored.clearanceOf(clear:)
  - title: "Migrate to 'bars'"
    date: 2026-10-14
    element:
      uris: [ 'harbor.dart' ]
      method: 'clearanceOf'
