# `dart fix` transforms for `bars:`, which replaced `clear:` and the HarborClear enum in 0.8.0 (#120,
# Q1), and became `clearsBars:` in 0.9.0. Checked by test_fixes/bars.dart.
#
# The rewrite depends on the value, so only the two literal spellings are fixed:
# `clear: HarborClear.coast` becomes `clearsBars: false`, and `clear: HarborClear.everything`, the
# default, is removed. A `clear:` given anything else (a variable, a conditional) is left for you.
# 0.8 let a call give both (`bars: b, clear: HarborClear.coast` meant `b && false`), so the coast
# branch removes a `bars:` too rather than leaving two; with `.everything` a `bars:` stands as it was,
# and rename.yaml renames it `clearsBars:`. The coast branch also removes a `clearsBars:`: dart fix
# orders transforms from different files differently by platform, and when rename.yaml runs first the
# `bars:` is already `clearsBars:`, so removing only `bars` left two (#163's CI, on Linux).
#
# 0.9.0 removed the enum and `clear:`, so the name HarborClear could go to the widget HarborMoored
# was. A call still on `clear:` no longer compiles, and these transforms still rewrite it, keyed on
# the classes the old names now resolve to (HarborFairway is a deprecated subclass, so it is keyed
# too). They read the argument as text, so `HarborClear.coast` matches though it names nothing now.
version: 1
transforms:
  # HarborMoored(clear:), now HarborClear(clear:)
  - title: "Migrate to 'clearsBars'"
    date: 2026-10-14
    element:
      uris: [ 'harbor.dart' ]
      constructor: ''
      inClass: 'HarborClear'
    oneOf:
      - if: "clear == 'HarborClear.coast'"
        changes:
          - kind: 'removeParameter'
            name: 'bars'
          - kind: 'removeParameter'
            name: 'clearsBars'
          - kind: 'addParameter'
            index: 0
            name: 'clearsBars'
            style: optional_named
            argumentValue:
              expression: 'false'
              requiredIf: "clear == 'HarborClear.coast'"
          - kind: 'removeParameter'
            name: 'clear'
      - if: "clear == 'HarborClear.everything'"
        changes:
          - kind: 'removeParameter'
            name: 'clear'
    variables:
      clear:
        kind: 'fragment'
        value: 'arguments[clear]'
  # HarborMoored.clearanceOf(clear:)
  - title: "Migrate to 'clearsBars'"
    date: 2026-10-14
