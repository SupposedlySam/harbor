# `dart fix` transforms for the names flares had through 0.3.0, when they were signals (renamed in
# 0.3.1). Each old name is a deprecated typedef of the new one; renamed, a call such as
# HarborSignals.raise(alignment: ...) then takes the placement transforms in placement.yaml too.
# Checked by test_fixes/signals.dart.
version: 1
transforms:
  - title: "Rename to 'HarborToasts'"
    date: 2026-10-14
    element:
      uris: [ 'harbor.dart' ]
      typedef: 'HarborSignals'
    changes:
      - kind: 'rename'
        newName: 'HarborToasts'
  - title: "Rename to 'HarborToastSlot'"
    date: 2026-10-14
    element:
      uris: [ 'harbor.dart' ]
      typedef: 'HarborSignalSlot'
    changes:
      - kind: 'rename'
        newName: 'HarborToastSlot'
  - title: "Rename to 'HarborToastTarget'"
    date: 2026-10-14
    element:
      uris: [ 'harbor.dart' ]
      typedef: 'HarborSignalTarget'
    changes:
      - kind: 'rename'
        newName: 'HarborToastTarget'
  - title: "Rename to 'HarborToastEntry'"
    date: 2026-10-14
    element:
      uris: [ 'harbor.dart' ]
      typedef: 'HarborSignalEntry'
    changes:
      - kind: 'rename'
        newName: 'HarborToastEntry'
  - title: "Rename to 'HarborToastTransitionBuilder'"
    date: 2026-10-14
    element:
      uris: [ 'harbor.dart' ]
      typedef: 'HarborSignalTransitionBuilder'
    changes:
      - kind: 'rename'
        newName: 'HarborToastTransitionBuilder'
  - title: "Rename to 'HarborToastClosedReason'"
    date: 2026-10-14
    element:
      uris: [ 'harbor.dart' ]
      typedef: 'HarborSignalClosedReason'
    changes:
      - kind: 'rename'
        newName: 'HarborToastClosedReason'
