  # HarborKeepInSight splits into three widgets, one per job. A call that does one job becomes that
  # widget; one that does two or more is left, deprecated and still working, to be nested by hand.
  # keepInSight: and lift: become the new widget's active: (below), so a variable carries over.
  # Arguments the one job never read go with it: clearance beside onObscured, edge beside the other two.
  - title: "Split into 'HarborCoverageListener', 'HarborKeepVisible' or 'HarborLift'"
    date: 2026-10-14
    element:
      uris: [ 'harbor.dart' ]
      constructor: ''
      inClass: 'HarborKeepInSight'
    oneOf:
      - if: "onObscured != '' && keepInSight == '' && lift == '' && onlyWhileFocused == '' && holdPosition == ''"
        changes:
          - kind: 'replacedBy'
            newElement:
              uris: [ 'harbor.dart' ]
              constructor: ''
              inClass: 'HarborCoverageListener'
          - kind: 'removeParameter'
            name: 'clearance'
      - if: "keepInSight != '' && onObscured == '' && lift == '' && holdPosition == ''"
        changes:
          - kind: 'replacedBy'
            newElement:
              uris: [ 'harbor.dart' ]
              constructor: ''
              inClass: 'HarborKeepVisible'
          - kind: 'removeParameter'
            name: 'edge'
      - if: "lift != '' && onObscured == '' && keepInSight == '' && onlyWhileFocused == ''"
        changes:
          - kind: 'replacedBy'
            newElement:
              uris: [ 'harbor.dart' ]
              constructor: ''
              inClass: 'HarborLift'
          - kind: 'removeParameter'
            name: 'edge'
    variables:
      onObscured:
        kind: 'fragment'
        value: 'arguments[onObscured]'
      keepInSight:
        kind: 'fragment'
        value: 'arguments[keepInSight]'
      lift:
        kind: 'fragment'
        value: 'arguments[lift]'
      onlyWhileFocused:
        kind: 'fragment'
        value: 'arguments[onlyWhileFocused]'
      holdPosition:
        kind: 'fragment'
        value: 'arguments[holdPosition]'
