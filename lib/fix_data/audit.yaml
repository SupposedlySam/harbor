  # The call HarborKeepInSight(onObscured:) became, still with the old parameter's name: a rename
  # does not carry across replacedBy, so it lands here, on a parameter HarborCoverageListener lacks.
  - title: "Rename to 'onCoverage'"
    date: 2026-10-14
    element:
      uris: [ 'harbor.dart' ]
      constructor: ''
      inClass: 'HarborCoverageListener'
    changes:
      - kind: 'renameParameter'
        oldName: 'onObscured'
        newName: 'onCoverage'
  # HarborKeepInSight(keepInSight:) became HarborKeepVisible(keepInSight:): it is active:.
  - title: "Rename to 'active'"
    date: 2026-10-14
    element:
      uris: [ 'harbor.dart' ]
      constructor: ''
      inClass: 'HarborKeepVisible'
    oneOf:
      - if: "keepInSight == 'true'"
        changes:
          - kind: 'removeParameter'
            name: 'keepInSight'
      - if: "keepInSight != 'true'"
        changes:
          - kind: 'renameParameter'
            oldName: 'keepInSight'
            newName: 'active'
    variables:
      keepInSight:
        kind: 'fragment'
        value: 'arguments[keepInSight]'
  # HarborKeepInSight(lift:) became HarborLift(lift:): it is active:.
  - title: "Rename to 'active'"
    date: 2026-10-14
    element:
      uris: [ 'harbor.dart' ]
      constructor: ''
      inClass: 'HarborLift'
    oneOf:
      - if: "lift == 'true'"
        changes:
          - kind: 'removeParameter'
            name: 'lift'
      - if: "lift != 'true'"
        changes:
          - kind: 'renameParameter'
            oldName: 'lift'
            newName: 'active'
    variables:
      lift:
        kind: 'fragment'
        value: 'arguments[lift]'
