name: harbor_test
description: "Sea trials for harbor: device presets, a pump helper that moves the keyboard, and clear-water matchers for widget tests."
version: 0.2.2
repository: https://github.com/SupposedlySam/harbor/tree/main/harbor_test
issue_tracker: https://github.com/SupposedlySam/harbor/issues
topics:
  - testing
  - layout
  - safe-area
  - keyboard
  - insets

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  # pubspec_overrides.yaml points this at the harbor beside it for development.
  harbor: ^0.4.0

dev_dependencies:
  flutter_lints: ^6.0.0
