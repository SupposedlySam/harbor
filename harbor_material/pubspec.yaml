name: harbor_material
description: "Material for harbor: a Scaffold-like frame, an AppBar bar, SnackBar-look toasts, Material sheets, and harbor defaults from the Material theme."
version: 0.1.1
repository: https://github.com/SupposedlySam/harbor/tree/main/harbor_material
issue_tracker: https://github.com/SupposedlySam/harbor/issues
topics:
  - material
  - layout
  - safe-area
  - keyboard
  - insets

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  # pubspec_overrides.yaml points this at the harbor beside it for development.
  harbor: ^1.0.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  harbor_test: ^1.0.0-dev.1
