# The dart fix golden tests (`dart fix --compare-to-golden`, run from this directory by
# tool/check.sh). Each `.dart` file is code written against harbor's deprecated API, and its
# `.dart.expect` is what `dart fix --apply` must turn it into.
#
# These files live inside the harbor package, so the deprecations they use are from the same
# package: deprecated_member_use_from_same_package is what makes the fixes fire here. A consumer's
# code gets the default deprecated_member_use instead.
include: ../analysis_options.yaml

linter:
  rules:
    - deprecated_member_use_from_same_package
