name: harbor_example
description: "Harbor Master: a small harbor game that puts every harbor pattern through its paces."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  harbor:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  harbor_test:
    path: ../harbor_test

# harbor_test asks for harbor from pub.dev; this keeps the one harbor here the one beside it.
dependency_overrides:
  harbor:
    path: ../

flutter:
  uses-material-design: true
