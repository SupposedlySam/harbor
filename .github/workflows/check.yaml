name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .fvmrc is the one place the Flutter version is pinned; read it rather than repeat it here.
      - id: sdk
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true

      - run: ./tool/check.sh
        env:
          FLUTTER: flutter
