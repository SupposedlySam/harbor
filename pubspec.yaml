name: harbor
description: "A harbor for your widgets. Docks claim the edges of the screen, everything else moors clear of them, sails under them or is open water, and the tide (the keyboard) rises over whatever doesn't float."
version: 0.1.0
repository: https://github.com/SupposedlySam/harbor
publish_to: 'none'

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  # Only package:harbor/testing.dart imports it; the main library does not.
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
